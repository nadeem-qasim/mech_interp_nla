[project]
name = "mech-interp-nla"
version = "0.1.0"
description = "Claim-deletion tests of natural language autoencoder (NLA) reconstructors on open Qwen NLAs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0",
    "transformers==5.16.1",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "numpy",
    "pandas",
    "matplotlib",
    "ipython",
    "ipykernel",
    "datasets",
    "tqdm",
    "peft>=0.20.0",
]

[tool.uv]
package = false
